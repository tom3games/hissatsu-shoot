<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>必殺シュートを描け！棒人間サッカー｜線を描いて技を作るブラウザゲーム</title>
<meta name="description" content="指でなぞった線がそのままシュートの軌道になる棒人間サッカー。カーブ・ジグザグ・ループの必殺シュートを自分で描いて名前を付け、試合で撃つ。同じ技はキーパーに見切られる。ブラウザで無料、スマホでそのまま遊べるサッカーゲーム。">
<meta property="og:type" content="website">
<meta property="og:title" content="必殺シュートを描け！棒人間サッカー">
<meta property="og:description" content="なぞった線が必殺シュートになる。技名だけは超大げさ。同じ技はキーパーに見切られる。">

<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Klee+One:wght@600&family=Yuji+Boku&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--ink:#17161a;--red:#e0322b;--red2:#a31f1a;--board:#f3f5f2;--alu:#b8bec4;--led:#ffb43a;--night:#0b1128;--grass:#2c7a3a;
  --brush:"Yuji Boku","Hiragino Mincho ProN","Yu Mincho",serif;--hand:"Klee One","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;--dot:"DotGothic16","Hiragino Sans",monospace;--sans:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
html[lang=en]{--brush:"Arial Black","Helvetica Neue",Arial,sans-serif;--hand:"Helvetica Neue",Arial,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--night)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--hand);color:var(--ink);overflow:hidden;height:100svh;background:var(--night)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
#cv{position:fixed;inset:0;width:100%;height:100%;z-index:0;touch-action:none;display:block}
.view{position:fixed;inset:0;height:100svh;overflow:hidden;z-index:5;pointer-events:none}
.view>*{pointer-events:auto}
#corner{position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;z-index:60;display:flex;gap:6px}
#corner button{min-width:44px;height:44px;border-radius:22px;background:rgba(8,12,28,.55);color:#e9edf5;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 10px}
#corner svg{width:20px;height:20px;fill:#e9edf5}

/* 読み込み（芝の上をボールが転がる） */
#loading{position:fixed;inset:0;z-index:90;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .35s}
#loading .lane{position:relative;width:180px;height:44px;border-bottom:3px solid #3f9b4d}
#loading .lane i{position:absolute;bottom:0;left:0;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:inset -4px -3px 0 rgba(0,0,0,.18);animation:roll 1.4s linear infinite}
#loading .lane i::after{content:"";position:absolute;left:7px;top:6px;width:7px;height:7px;background:#222;clip-path:polygon(50% 0,100% 38%,80% 100%,20% 100%,0 38%)}
@keyframes roll{0%{transform:translateX(0) rotate(0)}100%{transform:translateX(158px) rotate(720deg)}}
#loading p{font-size:15px;color:#dfe6f2}
#loadBar{width:160px;height:4px;background:rgba(255,255,255,.14);overflow:hidden}
#loadBar b{display:block;height:100%;width:0;background:var(--red);transition:width .2s}

/* タイトル */
#vTitle{display:flex;flex-direction:column;align-items:center;padding:calc(64px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom))}
#vTitle h1{font-family:var(--brush);font-weight:400;color:#fff;line-height:1.02;text-align:left;align-self:flex-start;margin-left:4vw;transform:rotate(-4deg);text-shadow:0 4px 0 var(--red2),0 8px 18px rgba(0,0,0,.55)}
#vTitle h1 .a{display:block;font-size:min(11vw,7svh,52px)}
#vTitle h1 .b{display:block;font-size:min(22vw,13svh,104px);color:var(--red);-webkit-text-stroke:2px #fff;paint-order:stroke fill;text-shadow:none;margin-left:12vw}
#vTitle .tag{align-self:flex-start;margin:6px 0 0 6vw;font-size:14px;font-weight:600;color:#e7ecf4;background:rgba(8,12,28,.6);padding:3px 10px;transform:rotate(-4deg)}
#vTitle .sp{flex:1;min-height:0}
#bStart{width:min(80vw,320px);min-height:58px;border-radius:6px;background:var(--red);color:#fff;font-family:var(--brush);font-size:26px;letter-spacing:.08em;box-shadow:0 5px 0 var(--red2),0 12px 24px rgba(0,0,0,.45)}
#bStart:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red2)}
#vTitle .links{display:flex;gap:22px;margin-top:10px}
#vTitle .links button{min-height:44px;padding:0 8px;color:#e7ecf4;font-size:15px;font-weight:600;text-shadow:0 1px 3px #000}

/* 作戦ボード（技を描く） */
#vEdit{display:flex;flex-direction:column}
#slots{display:flex;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 118px 0 8px}
.slot{position:relative;flex:1;max-width:84px;height:62px;background:var(--board);border-radius:3px;box-shadow:0 4px 10px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:3px}
.slot canvas{position:absolute;inset:0 0 16px 0;width:100%;height:calc(100% - 16px)}
.slot span{position:relative;font-size:10px;font-weight:600;line-height:1.1;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.slot.empty{background:rgba(243,245,242,.25);box-shadow:none;border:1.5px dashed rgba(255,255,255,.55);color:#fff}
.slot.on{outline:3px solid var(--red);outline-offset:1px}
.slot::before{content:"";position:absolute;top:3px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#2f6fd0;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25);z-index:2}
.slot.empty::before{display:none}
#editHint{align-self:center;margin-top:8px;font-size:15px;font-weight:600;color:#fff;background:rgba(8,12,28,.62);padding:5px 12px;border-radius:3px;pointer-events:none}
#editSp{flex:1;min-height:0;pointer-events:none}
#sheet{margin:0 8px calc(8px + env(safe-area-inset-bottom));background:var(--board);border-radius:4px;padding:10px 12px 12px;box-shadow:0 -2px 0 #fff inset,0 10px 30px rgba(0,0,0,.5);border-top:6px solid var(--alu)}
#sheet .row{display:flex;align-items:center;gap:8px}
#nameIn{flex:1;min-width:0;height:44px;border:0;border-bottom:2px solid #333;background:transparent;font-family:var(--brush);font-size:22px;color:var(--ink);padding:0 2px;border-radius:0;outline:none}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
#chips button{min-height:36px;padding:0 10px;border:1.5px solid #333;border-radius:18px;font-family:var(--brush);font-size:16px;background:#fff}
#chips button.on{background:#17161a;color:#fff}
#costRow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:10px}
#costBar{position:relative;flex:1;height:10px;background:#d9ddd8;border-radius:5px;overflow:hidden}
#costBar b{position:absolute;left:0;top:0;bottom:0;background:#3a8a46}
#costBar b.hv{background:#d8892a}#costBar b.xx{background:var(--red)}
#costWarn{color:var(--red2);font-size:12px}
.btnRow{display:flex;gap:8px}
.btnRow button{flex:1;min-height:48px;border-radius:4px;font-size:16px;font-weight:600}
.ghost{background:none;font-family:var(--hand);text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:3px;text-underline-offset:6px}
.hot{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red2)}
.hot:active{transform:translateY(2px);box-shadow:0 2px 0 var(--red2)}
#bPlay{margin:0 auto calc(14px + env(safe-area-inset-bottom));width:min(78vw,300px);min-height:56px;font-family:var(--brush);font-size:24px;border-radius:6px}

/* 試合 */
#vMatch{display:flex;flex-direction:column}
#board{display:flex;align-items:stretch;gap:8px;margin:calc(8px + env(safe-area-inset-top)) 118px 0 8px;pointer-events:none}
#led{background:#111214;border:2px solid #2a2b2f;border-radius:3px;padding:4px 8px 3px;font-family:var(--dot);color:var(--led);text-shadow:0 0 6px rgba(255,170,40,.65);display:flex;flex-direction:column;gap:1px;min-width:0}
#led .sc{display:flex;gap:8px;align-items:baseline;font-size:20px;line-height:1.1;white-space:nowrap}
#led .sc small{font-size:12px;color:#ffd79a;max-width:9em;overflow:hidden;text-overflow:ellipsis}
#led .mn{font-size:12px;color:#ffd79a;white-space:nowrap}
#legBox{flex:1;max-width:150px;display:flex;flex-direction:column;justify-content:center;gap:3px;background:rgba(8,12,28,.55);padding:4px 8px;border-radius:3px;color:#fff;font-size:12px;font-weight:600}
#legBox .bar{position:relative;height:9px;background:rgba(255,255,255,.18);border-radius:5px;overflow:hidden}
#legBox .bar b{position:absolute;left:0;top:0;bottom:0;background:#56c26a;transition:width .4s}
#legBox .bar i{position:absolute;top:0;bottom:0;background:rgba(224,50,43,.85)}
#live{align-self:flex-start;margin:8px 0 0 10px;font-size:14px;font-weight:600;color:#fff;background:rgba(8,12,28,.62);padding:4px 10px;border-left:4px solid var(--led);pointer-events:none;opacity:0;transition:opacity .25s;max-width:calc(100% - 24px)}
#live.on{opacity:1}
#matchSp{flex:1;min-height:0;pointer-events:none}
#clock{height:4px;margin:0 10px 6px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden;pointer-events:none}
#clock b{display:block;height:100%;background:var(--led);width:100%}
#actRow{display:flex;justify-content:flex-end;gap:8px;margin:0 8px 6px}
#actRow button{min-height:46px;border-radius:4px;font-weight:600}
#bFlip{padding:0 14px;background:rgba(243,245,242,.92);font-size:14px;border:1.5px solid #333}
#bKick{padding:0 26px;font-family:var(--brush);font-size:24px}
#cards{display:flex;gap:6px;padding:0 8px calc(8px + env(safe-area-inset-bottom))}
.card{position:relative;flex:1;min-width:0;height:90px;background:var(--board);border-radius:3px;box-shadow:1px 6px 14px rgba(0,0,0,.4);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;transition:transform .12s}
.card canvas{position:absolute;left:0;right:0;top:0;width:100%;height:46px}
.card .nm{position:relative;font-family:var(--brush);font-size:13px;line-height:1.12;padding:0 4px;color:#111;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;background:rgba(243,245,242,.85)}
.card .co{position:relative;font-size:12px;font-weight:700;padding:0 4px 3px;color:#1f5a2a}
.card .co.no{color:var(--red2)}
.card.on{transform:translateY(-8px);outline:3px solid var(--red);outline-offset:1px}
.card:disabled{opacity:.55}
.card::before{content:"";position:absolute;top:4px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--red);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25);z-index:2}

/* 技名の大書き */
#bigName{position:fixed;z-index:20;right:6vw;top:12svh;writing-mode:vertical-rl;font-family:var(--brush);font-size:min(17vw,10svh,84px);line-height:1;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--red);pointer-events:none;white-space:nowrap;opacity:0}
#bigName.en{writing-mode:horizontal-tb;right:auto;left:4vw;top:16svh;font-size:min(11vw,52px);white-space:normal;max-width:92vw;transform:rotate(-6deg)}
#bigName.go{animation:slam .5s cubic-bezier(.2,1.4,.4,1) forwards}
#bigName.out{animation:fadeOut .35s forwards}
@keyframes slam{0%{opacity:0;transform:scale(2.4) rotate(8deg)}100%{opacity:1;transform:none}}
#bigName.en.go{animation:slamEn .5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes slamEn{0%{opacity:0;transform:scale(2.2) rotate(2deg)}100%{opacity:1;transform:rotate(-6deg)}}
@keyframes fadeOut{0%{opacity:1}100%{opacity:0}}
#shout{position:fixed;z-index:21;left:0;right:0;top:40svh;text-align:center;font-family:var(--brush);font-size:min(24vw,15svh,120px);color:var(--led);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--red2);pointer-events:none;opacity:0}
#shout.go{animation:shoutA 1.4s ease-out forwards}
@keyframes shoutA{0%{opacity:0;transform:scale(.3)}12%{opacity:1;transform:scale(1.15)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
#bubble{position:fixed;z-index:19;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:3px 10px;font-weight:600;font-size:16px;white-space:nowrap;pointer-events:none;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s}
#bubble.on{opacity:1}
#bubble::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-6px;border:6px solid transparent;border-top:7px solid var(--ink)}
#finger{position:fixed;z-index:22;width:42px;height:42px;pointer-events:none;margin:-4px 0 0 -12px}

/* 掲示・ハーフタイム */
.ovl{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));background:rgba(5,8,20,.72)}
.ovl .in{width:min(100%,440px);max-height:100%;background:var(--board);border-top:8px solid var(--alu);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.ovl h2{font-family:var(--brush);font-weight:400;font-size:28px;line-height:1.1}
#half .in{position:relative;transform:rotate(-1.5deg);border-top:0;border:8px solid var(--alu);border-radius:3px;padding:22px 18px 16px;background:var(--board) repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,80,160,.07) 31px 32px)}
#half .in::before,#half .in::after{content:"";position:absolute;top:8px;width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:inset -3px -3px 0 rgba(0,0,0,.25)}
#half .in::before{left:14px}#half .in::after{right:14px;background:#2f6fd0}
#half h2{color:var(--red);font-size:34px;transform:rotate(-2deg)}
#half p{font-family:var(--hand);font-size:17px}
.ovl p{font-size:15px;line-height:1.55}
.ovl p b{color:var(--red2)}
.ovl small{font-size:11px;line-height:1.5;color:#5b6168}
.ovl .btnRow{margin-top:4px}

/* 結果（スポーツ新聞の一面） */
#vEnd{display:flex;flex-direction:column;align-items:center;gap:8px;padding:calc(56px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));background:rgba(5,8,20,.82)}
#paper{position:relative;flex:1;min-height:0;width:min(100%,430px);background:#eee7d8;box-shadow:0 14px 34px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;transform:rotate(-1.2deg)}
#paper.in{animation:spinIn .7s cubic-bezier(.2,1.1,.4,1)}
@keyframes spinIn{0%{transform:rotate(-540deg) scale(.1)}100%{transform:rotate(-1.2deg) scale(1)}}
#mast{display:flex;align-items:center;justify-content:space-between;background:var(--red);color:#fff;padding:5px 10px;font-weight:900;font-family:var(--sans)}
#mast b{font-size:20px;letter-spacing:.06em;font-weight:900}
#mast span{font-size:11px}
#pBody{flex:1;min-height:0;display:flex;gap:8px;padding:8px}
#pHead{writing-mode:vertical-rl;font-family:var(--sans);font-weight:900;color:var(--ink);font-size:min(10vw,6.4svh,44px);line-height:1.05;letter-spacing:-.02em;max-height:100%;overflow:hidden;flex:none}
#pHead em{font-style:normal;color:var(--red);display:block}
#pHead.en{writing-mode:horizontal-tb;font-size:min(7.4vw,30px);flex:none}
#pBody.en{flex-direction:column}
#pCol{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px}
#pPhoto{position:relative;flex:1;min-height:0;background:#222;overflow:hidden;filter:grayscale(.15) contrast(1.05)}
#pPhoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#pScore{display:flex;align-items:center;justify-content:space-between;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);padding:4px 2px;font-family:var(--sans);font-weight:900}
#pScore .n{font-size:30px;line-height:1}
#pScore .t{font-size:11px;font-weight:700}
#pStamp{position:absolute;right:12px;bottom:60px;width:86px;height:86px;border:4px solid var(--red);border-radius:50%;color:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--brush);font-size:26px;transform:rotate(-14deg);background:rgba(238,231,216,.6);text-align:center;line-height:1}
#pStat{font-size:12px;font-weight:600;line-height:1.4}
.endBtns{flex:none;display:flex;flex-direction:column;gap:6px;width:min(100%,400px)}
.endBtns .row{display:flex;gap:6px}
.endBtns .row button{flex:1;min-height:44px;border-radius:4px;font-size:14px;font-weight:600;background:rgba(243,245,242,.95)}
#bAgain{background:var(--red)!important;color:#fff;font-family:var(--brush);font-size:20px!important;box-shadow:0 4px 0 var(--red2)}
#card{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="loading"><div class="lane"><i></i></div><p id="loadTxt">芝を刈っています</p><div id="loadBar"><b></b></div></div>
<div id="corner">
  <button id="bLang" aria-label="language">EN</button>
  <button id="bMute" aria-label="sound"><svg viewBox="0 0 24 24"><path d="M3 9h4l6-5v16l-6-5H3z"/><path id="icoWave" d="M15 8.5a5 5 0 0 1 0 7v-2.2a2.6 2.6 0 0 0 0-2.6zM17 5a9 9 0 0 1 0 14v-2.4a6.6 6.6 0 0 0 0-9.2z"/></svg></button>
</div>

<main id="vTitle" class="view">
  <h1 id="tTitle"><span class="a" id="tT1"></span><span class="b" id="tT2"></span></h1>
  <p class="tag" id="tSub"></p>
  <div class="sp"></div>
  <button id="bStart"></button>
  <div class="links"><button id="bHow"></button></div>
</main>

<main id="vEdit" class="view" hidden>
  <div id="slots"></div>
  <p id="editHint"></p>
  <div id="editSp"></div>
  <div id="sheet" hidden>
    <div class="row"><input id="nameIn" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="name"></div>
    <div id="chips"></div>
    <div id="costRow"><span id="costLab"></span><div id="costBar"><b></b></div><span id="costNum"></span></div>
    <p id="costWarn" hidden></p>
    <div class="btnRow"><button id="bRedo" class="ghost"></button><button id="bSave" class="hot"></button></div>
  </div>
  <button id="bPlay" class="hot" hidden></button>
</main>

<main id="vMatch" class="view" hidden>
  <div id="board">
    <div id="led"><div class="sc"><small id="ledUs"></small><span id="ledScore">0-0</span><small id="ledThem"></small></div><div class="mn" id="ledMin">0'</div></div>
    <div id="legBox"><span id="legLab"></span><div class="bar"><b id="legFill"></b><i id="legCost"></i></div></div>
  </div>
  <p id="live"></p>
  <div id="matchSp"></div>
  <div id="actRow" hidden><button id="bFlip"></button><button id="bKick" class="hot"></button></div>
  <div id="clock"><b></b></div>
  <div id="cards"></div>
</main>

<div id="bigName"></div>
<div id="shout"></div>

<script>
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a,input')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  setTimeout(function(){
    if(window.__jsUp) return;
    var l=document.getElementById('loading');if(l)l.style.display='none';
    var d=document.createElement('div');d.style.cssText='position:fixed;inset:auto 8px 8px 8px;z-index:199;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;padding:10px';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },15000);
})();
</script>
